<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>등불나무 아래 빛 실험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root {
  --font: 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
  --cave: #120f1c;
  --panel: rgba(247, 241, 227, 0.92);
  --panel-edge: rgba(80, 60, 30, 0.22);
  --ink: #2a2238;
  --muted: #6d6380;
  --lamp: #b8761c;
  --lamp-soft: rgba(184, 118, 28, 0.16);
  --chip: rgba(42, 34, 56, 0.06);
  --chip-on: #2a2238;
  --chip-on-ink: #ffe3a6;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(24, 19, 36, 0.86);
    --panel-edge: rgba(255, 210, 122, 0.18);
    --ink: #f3ead8;
    --muted: #a79fb9;
    --lamp: #ffd27a;
    --lamp-soft: rgba(255, 210, 122, 0.14);
    --chip: rgba(255, 255, 255, 0.06);
    --chip-on: #ffd27a;
    --chip-on-ink: #241a0c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(24, 19, 36, 0.86);
  --panel-edge: rgba(255, 210, 122, 0.18);
  --ink: #f3ead8;
  --muted: #a79fb9;
  --lamp: #ffd27a;
  --lamp-soft: rgba(255, 210, 122, 0.14);
  --chip: rgba(255, 255, 255, 0.06);
  --chip-on: #ffd27a;
  --chip-on-ink: #241a0c;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
html, body { height: 100%; margin: 0; }
body {
  background: var(--cave);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all;
}
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.card {
  position: fixed;
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  color: var(--ink);
}
#intro {
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: calc(env(safe-area-inset-left, 0px) + 12px);
  max-width: min(330px, calc(100vw - 24px));
  padding: 10px 14px 11px;
  border-radius: 14px;
}
#intro h1 { margin: 0; font-size: 1.15rem; font-weight: 400; letter-spacing: -0.01em; }
#intro p { margin: 3px 0 0; font-size: 0.82rem; line-height: 1.4; color: var(--muted); }
#dock {
  left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  width: min(560px, calc(100vw - 24px));
  padding: 12px;
  border-radius: 18px;
  display: grid; gap: 10px;
}
#dock .body { display: grid; gap: 10px; }
#dock[data-hidden="true"] .body { display: none; }
.mode { display: grid; grid-template-columns: 1fr 1fr auto; gap: 6px; }
.mode button, .chips button, .tool {
  font: inherit; color: var(--ink);
  border: 1px solid var(--panel-edge);
  background: var(--chip);
  border-radius: 12px;
  min-height: 44px;
  padding: 0 12px;
  font-size: 0.98rem;
}
.mode button[aria-pressed="true"] {
  background: var(--chip-on); color: var(--chip-on-ink); border-color: transparent;
}
.mode .fold { min-width: 44px; padding: 0; font-size: 1.1rem; }
.caption { margin: 0; font-size: 0.86rem; line-height: 1.45; color: var(--muted); min-height: 2.5em; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row .label { font-size: 0.82rem; color: var(--muted); min-width: 2.6em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.chips button { min-height: 36px; border-radius: 999px; font-size: 0.88rem; padding: 0 12px; }
.chips button[aria-pressed="true"] { background: var(--lamp-soft); border-color: var(--lamp); color: var(--ink); }
.chips button[aria-pressed="false"] { opacity: 0.62; }
.chips[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
.tool { background: var(--lamp-soft); border-color: var(--lamp); }
button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
#fps { position: fixed; right: calc(env(safe-area-inset-right, 0px) + 10px); top: calc(env(safe-area-inset-top, 0px) + 10px); font-size: 0.72rem; color: rgba(255,255,255,.45); pointer-events: none; }
#err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; color: #f3ead8; background: var(--cave); font-size: 1rem; line-height: 1.6; }
@media (max-width: 420px) {
  #intro p { display: none; }
  .row .label { display: none; }
  #dock { padding: 10px; gap: 8px; }
  .caption { font-size: 0.8rem; min-height: 0; }
  .chips button { min-height: 34px; padding: 0 10px; font-size: 0.84rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="view" aria-label="동굴 장면. 방향키로 캐릭터를 움직여요"></canvas>
<div id="intro" class="card">
  <h1>등불나무 아래 빛 실험</h1>
  <p>방향키나 WASD로 걸어요. 화면을 누르고 있으면 그쪽으로 걸어가요.</p>
</div>
<div id="fps"></div>
<div id="dock" class="card" data-hidden="false">
  <div class="mode" role="group" aria-label="빛 계산 방식">
    <button id="mOld" aria-pressed="false">지금 게임</button>
    <button id="mNew" aria-pressed="true">새 방식</button>
    <button id="fold" class="fold" aria-label="조작판 접기" aria-expanded="true">▾</button>
  </div>
  <div class="body">
    <p class="caption" id="cap"></p>
    <div class="row">
      <span class="label">효과</span>
      <div class="chips" id="fx" role="group" aria-label="새 방식 효과">
        <button data-k="shadow" aria-pressed="true">벽 그림자</button>
        <button data-k="face" aria-pressed="true">앞면 조명</button>
        <button data-k="emis" aria-pressed="true">발광</button>
        <button data-k="bloom" aria-pressed="true">번짐</button>
      </div>
    </div>
    <div class="row">
      <span class="label">깔기</span>
      <div class="chips" id="lk" role="group" aria-label="깔 바닥">
        <button data-p="1" aria-pressed="false">잔디</button>
        <button data-p="2" aria-pressed="false">흙</button>
        <button data-p="10" aria-pressed="false">물</button>
        <button data-p="5" aria-pressed="true">나무 바닥</button>
        <button data-p="6" aria-pressed="false">돌 바닥</button>
      </div>
      <button class="tool" id="lay">바닥 깔기</button>
    </div>
    <div class="row">
      <span class="label">바닥</span>
      <div class="chips" id="fl" role="group" aria-label="바닥 타일 잇는 방식">
        <button data-f="3" aria-pressed="true">에셋으로</button>
        <button data-f="2" aria-pressed="false">새 그림</button>
        <button data-f="1" aria-pressed="false">자연스럽게</button>
        <button data-f="0" aria-pressed="false">칸 조각 (이전)</button>
      </div>
    </div>
    <div class="row">
      <span class="label">걷기</span>
      <div class="chips" id="wk" role="group" aria-label="걷기와 카메라">
        <button data-w="1" aria-pressed="true">부드럽게</button>
        <button data-w="0" aria-pressed="false">픽셀 단위 (이전)</button>
      </div>
    </div>
    <div class="row">
      <span class="label">속도</span>
      <div class="chips" id="spd" role="group" aria-label="걷는 속도">
        <button data-s="3.2" aria-pressed="false">느리게</button>
        <button data-s="3.8" aria-pressed="false">조금 느리게</button>
        <button data-s="4.4" aria-pressed="true">게임과 같게</button>
      </div>
    </div>
    <div class="row">
      <span class="label">보기</span>
      <div class="chips" id="vw" role="group" aria-label="보기">
        <button data-v="0" aria-pressed="true">완성</button>
        <button data-v="1" aria-pressed="false">빛만</button>
        <button data-v="2" aria-pressed="false">면 정보</button>
        <button data-v="3" aria-pressed="false">발광층</button>
      </div>
      <button class="tool" id="torch">횃불 놓기</button>
    </div>
  </div>
</div>
<div id="err"></div>

// ---------- size, input, loop ----------
const SCR = { w: 1, h: 1, dpr: 1, dockTop: 0 };
const dockEl = $('dock');

function resize() {
  const dpr = Math.min(3, window.devicePixelRatio || 1), w = innerWidth, h = innerHeight;
  view.width = Math.round(w * dpr); view.height = Math.round(h * dpr);
  SCR.w = w; SCR.h = h; SCR.dpr = view.width / w;
  const target = Math.max(30, Math.min(54, Math.min(w, h) / 10.5));

const keys = new Set(); let pointer = null;

let last = 0, frames = 0, acc = 0, work = 0; const fpsEl = document.getElementById('fps');
const PERF = { n: 0, cpu: 0 };
function frame(now) {

// ---------- UI ----------
const CAP = {
  0: '지금 게임처럼 칸마다 밝기를 하나씩 계산해요. 벽 너머는 10%만 밝아지고, 경계가 칸 크기로 뭉개져요.',
  1: '화면 픽셀마다 빛을 계산해요. 벽이 빛을 막아 그림자가 생기고, 벽 앞면은 앞쪽 빛만 받아요.',
};
function syncUI() {
  $('mOld').setAttribute('aria-pressed', ST.mode === 0); $('mNew').setAttribute('aria-pressed', ST.mode === 1);
  $('cap').textContent = CAP[ST.mode];
  $('fx').setAttribute('aria-disabled', ST.mode === 0);
  for (const b of $('fx').querySelectorAll('button')) b.setAttribute('aria-pressed', !!ST[b.dataset.k]);
  if (ST.mode === 0 && ST.view > 1) ST.view = 0;
  for (const b of $('vw').querySelectorAll('button')) { const v = +b.dataset.v; b.setAttribute('aria-pressed', ST.view === v); b.hidden = ST.mode === 0 && (v === 2 || v === 3); }
  for (const b of $('wk').querySelectorAll('button')) b.setAttribute('aria-pressed', +b.dataset.w === (DBG.snap ? 0 : 1));
  for (const b of $('lk').querySelectorAll('button')) b.setAttribute('aria-pressed', +b.dataset.p === ST.lay);
  for (const b of $('fl').querySelectorAll('button')) b.setAttribute('aria-pressed', +b.dataset.f === ST.floorNew);
  for (const b of $('spd').querySelectorAll('button')) b.setAttribute('aria-pressed', +b.dataset.s === ST.speed);
  torchOn = null; torchLabel();
}
// the torch button label follows where the walker faces; only touch the page when it actually changes
let torchOn = null;
function torchLabel() { const on = placed.has(torchSpot()); if (on === torchOn) return; torchOn = on; $('torch').textContent = on ? '횃불 치우기' : '횃불 놓기'; }
function torchSpot() {
  const fx = { down: [0, 1], up: [0, -1], side: [P.flip ? -1 : 1, 0] }[P.face];
  const x = Math.floor(P.x) + fx[0], y = Math.floor(P.y - .2) + fx[1]; return inB(x, y) ? y * MW + x : -1;
}
$('mOld').onclick = () => { ST.mode = 0; syncUI(); };
$('mNew').onclick = () => { ST.mode = 1; syncUI(); };
$('fold').onclick = () => { const d = $('dock'), h = d.dataset.hidden !== 'true'; d.dataset.hidden = h; $('fold').textContent = h ? '▴' : '▾'; $('fold').setAttribute('aria-expanded', !h); $('fold').setAttribute('aria-label', h ? '조작판 펴기' : '조작판 접기'); measureDock(); };
$('fx').onclick = e => { const b = e.target.closest('button'); if (!b) return; ST[b.dataset.k] = ST[b.dataset.k] ? 0 : 1; syncUI(); };
$('vw').onclick = e => { const b = e.target.closest('button'); if (!b) return; ST.view = +b.dataset.v; syncUI(); };
$('wk').onclick = e => { const b = e.target.closest('button'); if (!b) return; DBG.snap = b.dataset.w === '0'; camF.on = false; syncUI(); };
$('fl').onclick = e => { const b = e.target.closest('button'); if (!b) return; ST.floorNew = +b.dataset.f; catchUpFloor(); syncUI(); };
$('spd').onclick = e => { const b = e.target.closest('button'); if (!b) return; ST.speed = +b.dataset.s; syncUI(); };
// floor blocks: paint the tile in front of the walker; only the area around it is redrawn and sent to the GPU
const FLOOR_PEND = [[], [], [], []]; // tiles changed while another floor style was on screen
function refloorOne(v, tx, ty) {
  const win = [tx, ty, tx, ty], r = [() => bakeFloor(win), () => bakeFloorNew('sheet', win), () => bakeFloorNew('new', win), () => bakeFloorNew('asset', win)][v]();
  const SP = [FLOOR_S, FLOORN_S, FLOORN2_S, FLOORN3_S][v], F = [FLOOR, FLOOR_N, FLOOR_N2, FLOOR_N3][v];

$('lk').onclick = e => { const b = e.target.closest('button'); if (!b) return; ST.lay = +b.dataset.p; syncUI(); };
$('torch').onclick = () => { const i = torchSpot(); if (i < 0) return; if (placed.has(i)) placed.delete(i); else if (!wall[i] && floor[i] !== 10 && !objs.has(i)) placed.add(i); placedVer++; syncUI(); };

if (!gl) { fail('이 브라우저는 WebGL2를 지원하지 않아서 실험 장면을 그릴 수 없어요. 최신 Safari나 Chrome에서 열어 주세요.'); return; }
