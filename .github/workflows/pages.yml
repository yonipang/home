name: Test and deploy web build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and web templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fL --retry 3 $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -j -q /tmp/templates.tpz 'templates/web*' -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Import
        run: godot --headless --import || true
      - name: Unit tests
        run: godot --headless --script res://tests/run_tests.gd
      - name: Smoke test (one full day, party, forgetting)
        shell: bash
        run: |
          set -o pipefail
          godot --headless -- --smoke 2>&1 | tee /tmp/smoke.log
          grep -q "SMOKE OK" /tmp/smoke.log
          ! grep -q "SCRIPT ERROR" /tmp/smoke.log
      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.pck
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
